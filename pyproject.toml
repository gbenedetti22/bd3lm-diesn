[project]
name = "bd3lms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "accelerated-scan>=0.3.1",
  "datasets>=4.8.5",
  "jax>=0.10.1",
  "matplotlib>=3.10.9",
  "mauve-text>=0.4.0",
  "numpy>=2.4.6",
  "pyarrow>=24.0.0",
  "tiktoken>=0.13.0",
  # "tokenizers>=0.22.2",
  "torch==2.9.*",
  "torchvision",
  "torchviz>=0.0.3",
  "tqdm>=4.67.3",
  "transformers==4.38.2",
  "flash_attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.11/flash_attn-2.8.3+cu129torch2.9-cp311-cp311-linux_x86_64.whl",
  "flash-linear-attention>=0.5.0",
  "rotary-embedding-torch>=0.8.9",
  "setuptools>=82.0.1",
  "wandb>=0.27.2",
  "lightning>=2.6.5",
  "rich>=15.0.0",
  "ipywidgets>=8.1.8",
  "nltk>=3.10.0",
  "torchdata>=0.11.0",
  "omegaconf>=2.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
cache-dir = "./.uv_cache"

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
mamba = ["mamba-ssm[causal-conv1d]>=2.3.2.post1"] # uv sync --extra mamba
